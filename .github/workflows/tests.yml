# Runs the unit tests (GUT, tests/) on every push to develop and by hand from the Actions tab.
# A failing test turns the job red; nothing is published (Pages runs them again before deploying).
name: Tests

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Godot
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip

      - name: Import and test
        run: |
          ./godot --headless --path . --import
          ./godot --headless --path . --script res://addons/gut/gut_cmdln.gd
